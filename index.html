                syllabus: [
                    { topic: "Pembawa Acara vs Pembicara", objective: "Bedakan peran MC & Speaker, pilih minat.", activity: "Game 'Switch!' (Gaya MC vs Pidato), Cicip Peran, Voting minat awal." },
                    { topic: "Fondasi Kepercayaan Diri", objective: "Berdiri di 'Center Stage' tanpa gugup.", activity: "Senam 'Buang Malu', Challenge 'Patung Panggung' (Diam 30 detik ditatap)." },
                    { topic: "Kekuatan Vokal: Proyeksi", objective: "Proyeksi suara lantang bulat (Suara perut).", activity: "Latihan napas perut, Challenge 'Teriak di Bukit' (Jarak jauh)." },

                    { topic: "Metode Hamburger", objective: "Susun struktur (Pembuka-Isi-Penutup).", activity: "Analogi Hamburger, Menulis kerangka/rundown di lembar kerja." },

                    { topic: "Alat: Mik & Kartu Catatan", objective: "Gunakan mikrofon & kartu catatan benar.", activity: "Simulasi Alat (Jarak mic 3 jari), Teknik pegang Cue Card (Lirik sesekali)." },
                    { topic: "Kontak Mata", objective: "Kontak mata menyebar (Teknik Sapu Jagat).", activity: "Game 'Lighthouse' (Tatap teman kiri-tengah-kanan 3 detik bergantian)." },
                    { topic: "Intonasi & Jeda", objective: "Atur nada & jeda agar tidak monoton.", activity: "Menandai naskah (Garis bawah/miring/stop), Baca dengan 'rasa'." },
                    { topic: "Kolaborasi MC & Pembicara", objective: "Kolaborasi transisi panggung mulus.", activity: "Latihan 'Tektokan Panggung' (Panggil-Masuk-Salaman-Mundur)." },
                    { topic: "Keterampilan Interaksi", objective: "Sisipkan interaksi dengan penonton.", activity: "Tambah pertanyaan ke audiens, Latihan menunggu respon (Jeda 2 detik)." },

                    { topic: "Menangani Gangguan", objective: "Tetap fokus bicara meski ada gangguan.", activity: "Challenge 'Uji Nyali Panggung' (Diganggu suara/tepuk tangan/mic mati)." },
                    { topic: "Pengecekan Kostum & Gaya", objective: "Pilih pakaian rapi & mendukung PD.", activity: "Fashion Show & Pose, Cek kenyamanan baju/sepatu." },
                    { topic: "Simulasi Panggung", objective: "Tampil di depan orang asing (Tamu).", activity: "Mini Showcase (Undang guru lain/staf), Latihan mental ditonton orang baru." },
                    { topic: "Gladi Resik 1", objective: "Jalankan acara tanpa henti (Run Through).", activity: "Simulasi total (Mic/Musik), Rekam video, Nonton evaluasi mandiri." },

            <div className="flex items-center gap-3 bg-white/80 backdrop-blur-sm p-2 rounded-xl shadow-lg border border-indigo-100">

                    YEC
                </div>
                <div className="flex flex-col text-left">
                    <span className="text-xs font-extrabold text-indigo-900 tracking-wide uppercase">PT Yureka Edukasi Cipta</span>
                    <span className="text-[10px] text-indigo-500 font-bold flex items-center gap-1">
                         Kampung Inggris Pare
                    </span>
                </div>
            </div>
        );

        const Slide = ({ children, className, bgClass, id }) => (
            <div id={id} className={`w-screen flex-shrink-0 relative ${bgClass} md:h-screen md:overflow-hidden min-h-screen`}>
                {/* Background Pattern */}
                <div className="absolute inset-0 bg-pattern-dots opacity-30 pointer-events-none"></div>
                
                {/* Decorative Blobs */}

                <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-white opacity-40 rounded-full mix-blend-overlay filter blur-3xl animate-blob animation-delay-2000"></div>

                </div>

        const LandingPage = () => {
            const [currentPage, setCurrentPage] = useState(0);
            const totalPages = levelsData.length + 2; 

            const scrollToPage = (index) => {
                if (index < 0 || index >= totalPages) return;
                setCurrentPage(index);
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (window.innerWidth >= 768) { // Only enable keyboard nav on desktop
                        if (e.key === 'ArrowRight') scrollToPage(currentPage + 1);
                        if (e.key === 'ArrowLeft') scrollToPage(currentPage - 1);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentPage]);

            return (
                <div className="w-full relative overflow-x-hidden md:h-screen md:overflow-hidden">
                    
                    {/* Floating Nav Buttons (Desktop Only) */}
                    <div className="hidden md:flex absolute bottom-6 right-6 z-50 gap-3">
                        <button 
                            onClick={() => scrollToPage(currentPage - 1)}
                            disabled={currentPage === 0}
                            className={`p-3 md:p-4 rounded-full shadow-xl transition-all duration-300 transform border-2 md:border-4 ${currentPage === 0 ? 'bg-gray-200 border-gray-200 text-gray-400 scale-90 opacity-50 cursor-not-allowed' : 'bg-white border-white text-indigo-600 hover:scale-110 hover:rotate-3 active:scale-95'}`}

                            <ChevronLeft className="w-6 h-6 md:w-7 md:h-7" />
                        </button>
                        <button 
                            onClick={() => scrollToPage(currentPage + 1)}
                            disabled={currentPage === totalPages - 1}
                            className={`p-3 md:p-4 rounded-full shadow-xl transition-all duration-300 transform border-2 md:border-4 ${currentPage === totalPages - 1 ? 'bg-gray-200 border-gray-200 text-gray-400 scale-90 opacity-50 cursor-not-allowed' : 'bg-indigo-600 border-indigo-500 text-white hover:bg-indigo-500 hover:scale-110 hover:-rotate-3 active:scale-95'}`}
                        >
                            <ChevronRight className="w-6 h-6 md:w-7 md:h-7" />
                        </button>
                    </div>

                    {/* Fun Progress Bar (Desktop Only) */}
                    <div className="hidden md:flex absolute bottom-8 left-6 z-50 gap-2 p-2 bg-white/60 backdrop-blur-md rounded-full shadow-sm border border-white/50">
                        {Array.from({ length: totalPages }).map((_, idx) => (
                            <div 
                                key={idx}
                                onClick={() => scrollToPage(idx)}
                                className={`h-3 rounded-full transition-all duration-500 cursor-pointer shadow-sm ${
                                    currentPage === idx 
                                        ? 'w-8 bg-indigo-500 ring-2 ring-indigo-200' 
                                        : 'w-3 bg-white hover:bg-indigo-200 hover:scale-125'

                            />
                        ))}

                        className="flex flex-col md:flex-row h-auto md:h-full md:transition-transform md:duration-700 md:ease-[cubic-bezier(0.34,1.56,0.64,1)]"

                            transform: window.innerWidth >= 768 ? `translateX(-${currentPage * 100}vw)` : 'none'
                        }}

                            </div>

                                <div className="absolute -bottom-8 -right-16 text-pink-400 animate-float hidden md:block"><Sparkles className="w-24 h-24"/></div>

                                    Public Speaking<br/>
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600 drop-shadow-none">Anak Reguler</span>
                                </h1>
                                <p className="text-lg md:text-2xl text-indigo-800 mb-10 max-w-2xl mx-auto font-bold opacity-80 leading-relaxed">

                                >

                            </div>

                        {/* PAGE 2: INFO */}
                        <Slide id="info-section" bgClass="bg-gradient-to-tr from-cyan-100 via-blue-50 to-indigo-100" className="flex items-center justify-center px-4 md:px-6 py-10 md:py-0">

                                <div className="text-center mb-10 md:mb-12 relative">

                                        </p>
                                    </div>
                                </div>
                            </div>
                        </Slide>

                        {/* PAGE 3-7: LEVELS */}
                        {levelsData.map((level, index) => (
                            <Slide key={index} bgClass={`bg-gradient-to-br ${level.theme}`} className="flex flex-col h-full py-10 md:py-0">
                                {/* Header */}
                                <div className="md:pt-6 pb-2 px-4 md:px-12 flex-shrink-0 z-20">
                                    <div className="bg-white/90 backdrop-blur-xl rounded-[2rem] p-4 md:p-6 shadow-xl border-4 border-white flex flex-col md:flex-row md:items-center justify-between gap-4 md:gap-6">

                                                {level.icon}

                                            <div>
                                                <div className="flex items-center gap-3 mb-1">
                                                    <span className={`px-3 py-1 md:px-4 md:py-1.5 rounded-full text-xs md:text-sm font-black uppercase tracking-wider bg-white border-2 ${level.border} ${level.accent} shadow-sm`}>

                                                </div>

                                            </div>
                                        </div>
                                        <div className="hidden xl:block text-right bg-gray-50 px-6 py-3 rounded-2xl border-2 border-gray-100">
                                            <p className="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">Total Misi</p>

                                            <div key={sIdx} className={`bg-white rounded-3xl p-5 border-2 ${level.border} shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 flex flex-col h-full relative overflow-hidden group min-h-[180px]`}>
                                                
                                                {/* Card Decoration */}
                                                <div className={`absolute top-0 right-0 w-20 h-20 ${level.cardBg} rounded-bl-full -mr-10 -mt-10 opacity-50 group-hover:scale-150 transition-transform duration-500`}></div>

                                                        Misi #{sIdx + 1}
                                                    </span>
                                                </div>
                                                
                                                <h4 className={`font-black text-base md:text-lg mb-3 leading-tight text-gray-800 group-hover:${level.accent} transition-colors relative z-10 line-clamp-2`}>
                                                    {session.topic}
                                                </h4>
                                                
                                                <div className="mt-auto space-y-3 relative z-10">
                                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                                        <p className="text-[9px] uppercase font-black text-gray-400 mb-1 flex items-center gap-1">
                                                            <Target className="w-3 h-3" /> Tujuan
                                                        </p>
                                                        <p className="text-xs text-gray-600 font-bold leading-snug line-clamp-3">
                                                            {session.objective}
                                                        </p>
                                                    </div>
                                                    <div>
                                                        <p className="text-[9px] uppercase font-black text-gray-400 mb-1 flex items-center gap-1">
                                                            <Star className="w-3 h-3" /> Aktivitas Seru
                                                        </p>
                                                        <p className={`text-xs italic font-medium leading-snug ${level.accent} line-clamp-2`}>
                                                            "{session.activity}"
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </Slide>
                        ))}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LandingPage />);
    </script>
</body>
</html>
